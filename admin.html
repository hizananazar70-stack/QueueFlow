<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body {
  font-family:'Segoe UI';
  display:flex;justify-content:center;align-items:center;height:100vh;
  background:#f5f5f5;
}
.card {
  background:white;padding:40px;border-radius:20px;text-align:center;
}
button {
  padding:15px 25px;background:red;color:white;border:none;border-radius:10px;
}
</style>
</head>

<body>

<div class="card">
  <h2>Admin Panel</h2>
  <button onclick="callNext()">Call Next Token</button>
  <p id="msg"></p>
</div>

<script>
function callNext() {
  let currentToken = localStorage.getItem("currentToken") || 100;
  currentToken = parseInt(currentToken) + 1;

  localStorage.setItem("currentToken", currentToken);

  let now = new Date().toLocaleTimeString();
  localStorage.setItem("tokenTime", now);

  document.getElementById("msg").innerHTML =
    "Now Calling: <b>" + currentToken + "</b>";
}
</script>

</body>
</html>
