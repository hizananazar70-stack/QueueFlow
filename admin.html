<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel | QueueFlow</title>

<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  text-align: center;
  margin: 0;
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}


.back {
  position: absolute;
  top: 20px;
  left: 20px;
  color: #636e72;
  text-decoration: none;
  font-size: 14px;
}
.back:hover { color: black; }

.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  width: 90%;
  max-width: 400px;
}

h1 { color: #2d3436; margin-bottom: 20px; }

button {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  border-radius: 12px;
  background-color: #d63031;
  color: white;
}

button:hover { background-color: #c0392b; }

.result {
  margin-top: 20px;
  font-size: 18px;
  color: #2d3436;
}
</style>
</head>

<body>

<a href="index.html" class="back">← Back</a>

<div class="card">
  <h1>Admin Panel</h1>

  <button onclick="callNext()">Call Next Token</button>

  <div class="result" id="result"></div>
</div>

<script>
function callNext() {
  let currentToken = localStorage.getItem("currentToken") || 100;
  currentToken = parseInt(currentToken) + 1;

  
  localStorage.setItem("currentToken", currentToken);

  
  let now = new Date().toLocaleTimeString();
  localStorage.setItem("tokenTime", now);

  document.getElementById("result").innerHTML =
    `Now Calling Token <b>${currentToken}</b>`;
}
</script>

</body>
</html>
