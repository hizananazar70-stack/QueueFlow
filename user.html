<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Panel | QueueFlow</title>

<style>
body {
  font-family: 'Segoe UI';
  text-align: center;
  background: linear-gradient(135deg,#f5f7fa,#c3cfe2);
  display:flex;justify-content:center;align-items:center;height:100vh;
}
.card {
  background:white;padding:40px;border-radius:20px;width:350px;
}
input {
  width:100%;padding:15px;margin-bottom:15px;border-radius:10px;border:1px solid #ccc;
}
button {
  width:100%;padding:15px;background:#28a745;color:white;border:none;border-radius:10px;
}
</style>
</head>

<body>

<div class="card">
  <h2>Join Queue</h2>
  <input type="text" id="name" placeholder="Enter Name">
  <button onclick="getToken()">Get Token</button>
  <p id="result"></p>
</div>

<script>
function getToken() {
  let name = document.getElementById("name").value;

  if (!name) {
    alert("Enter name");
    return;
  }

  let lastToken = localStorage.getItem("lastToken") || 100;
  lastToken = parseInt(lastToken) + 1;

  localStorage.setItem("lastToken", lastToken);

  let queue = JSON.parse(localStorage.getItem("queue")) || [];
  queue.push({name:name, token:lastToken});
  localStorage.setItem("queue", JSON.stringify(queue));

  document.getElementById("result").innerHTML =
    "Your Token: <b>" + lastToken + "</b>";
}
</script>

</body>
</html>
