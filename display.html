<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Display | QueueFlow</title>

<style>
body {
  font-family:'Segoe UI';
  text-align:center;
  background:#121212;color:white;
  display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;
}
.token-box {
  background:#1e1e1e;padding:40px 80px;border-radius:20px;
}
.token {
  font-size:150px;color:#007bff;
}
</style>
</head>

<body>

<h1>Status Board</h1>

<div class="token-box">
  <p>NOW SERVING</p>
  <div id="token" class="token">100</div>

  <p id="time"></p>
  <p id="currentTime"></p>
</div>

<script>
function loadData() {
  let token = localStorage.getItem("currentToken") || 100;
  let time = localStorage.getItem("tokenTime") || "--";

  document.getElementById("token").innerText = token;
  document.getElementById("time").innerText =
    "Token Called At: " + time;
}

function updateClock() {
  let now = new Date();
  document.getElementById("currentTime").innerText =
    "Current Time: " + now.toLocaleTimeString();
}

setInterval(()=>{
  loadData();
  updateClock();
},1000);

loadData();
updateClock();
</script>

</body>
</html>
