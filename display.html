<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Display | QueueFlow</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  text-align: center;
  margin: 0;
  background-color: #121212;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Back Button */
.back {
  position: absolute;
  top: 20px;
  left: 20px;
  color: #888;
  text-decoration: none;
  font-size: 14px;
}
.back:hover { color: white; }

h1 {
  font-size: 2.5rem;
  color: #aaa;
}

.token-box {
  background: #1e1e1e;
  padding: 40px 80px;
  border-radius: 25px;
  box-shadow: 0 0 40px rgba(0, 123, 255, 0.2);
}

.token {
  font-size: 180px;
  color: #007bff;
  margin: 0;
}

.info {
  margin-top: 20px;
  font-size: 18px;
  color: #ccc;
}
</style>
</head>

<body>

<a href="index.html" class="back">← Back</a>

<h1>Status Board</h1>

<div class="token-box">
  <p>NOW SERVING</p>
  <p id="token" class="token">100</p>

  <div class="info">
    <p id="calledTime">Called At: --</p>
    <p id="expectedTime">Estimated Wait Time: --</p>
  </div>
</div>

<script>
function loadData() {

  let currentToken = parseInt(localStorage.getItem("currentToken")) || 100;
  let lastToken = parseInt(localStorage.getItem("lastToken")) || currentToken;

 
  document.getElementById("token").innerText = currentToken;

 
  let calledTime = localStorage.getItem("tokenTime") || "--";
  document.getElementById("calledTime").innerText =
    "Called At: " + calledTime;


  let remaining = lastToken - currentToken;

  let serviceTimePerToken = 2; 

  let waitTime = remaining * serviceTimePerToken;

  if (remaining <= 0) {
    document.getElementById("expectedTime").innerText =
      "Estimated Wait Time: No Waiting";
  } else {
    document.getElementById("expectedTime").innerText =
      "Estimated Wait Time: " + waitTime + " minutes";
  }
}


setInterval(loadData, 1000);
loadData();
</script>

</body>
</html>
